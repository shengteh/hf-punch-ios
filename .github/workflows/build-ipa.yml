name: Build and sign IPA

on:
  push:
    branches: [main, master]
  schedule:
    # Weekly rebuild Monday 03:00 UTC — picks up newly registered UDIDs
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild -project HFPunch.xcodeproj \
            -scheme HFPunch \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/HFPunch.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned IPA
        run: |
          cd build/HFPunch.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r HFPunch.app Payload/
          zip -qry HFPunch-unsigned.ipa Payload
          mv HFPunch-unsigned.ipa "$GITHUB_WORKSPACE/build/"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HFPunch-unsigned-ipa
          path: build/HFPunch-unsigned.ipa

  release:
    needs: build
    runs-on: macos-15
    # Only signs when the cert secrets exist; skips gracefully otherwise
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: HFPunch-unsigned-ipa
          path: ipa

      - name: Install zsign
        run: brew install zsign

      - name: Sign and release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
          CERT_P12_B64: ${{ secrets.CERT_P12_B64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          UDID_WORKER_URL: ${{ secrets.UDID_WORKER_URL }}
          UDID_WORKER_TOKEN: ${{ secrets.UDID_WORKER_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/sign-and-release.sh ipa/HFPunch-unsigned.ipa

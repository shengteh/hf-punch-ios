name: HFPunch
options:
  bundleIdPrefix: my.haifu
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
targets:
  HFPunch:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: my.haifu.punch
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: HF Punch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "HF Punch uses your location to verify punch in/out at your work site."
        BGTaskSchedulerPermittedIdentifiers:
          - my.haifu.punch.refresh
        UIBackgroundModes:
          - fetch
        ITSAppUsesNonExemptEncryption: false
